<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Salimos?</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F2E2C; --card:#153F3C; --gold:#E7A33E; --coral:#F2665A;
    --cream:#FBF3E4; --muted:#9FC2BE; --line:#2C5350;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:'Poppins',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:32px 16px;
  }
  .ticket{
    width:100%; max-width:420px; background:var(--card);
    border:1px solid var(--line); position:relative;
    padding:36px 28px 30px;
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:28px; height:28px;
    background:var(--bg); border-radius:50%; top:50%; transform:translateY(-50%);
  }
  .ticket::before{left:-14px;} .ticket::after{right:-14px;}
  .stub-line{
    border-top:2px dashed var(--line); margin:26px 0;
  }
  h1{
    font-family:'Bebas Neue',sans-serif; font-size:44px; letter-spacing:1px;
    line-height:1; margin:0 0 6px; color:var(--gold);
  }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:4px;}
  .label{
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.5px;
    color:var(--cream); margin:0 0 14px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .chip{
    flex:1 1 auto; min-width:100px; background:transparent;
    border:1.5px solid var(--muted); color:var(--cream);
    font-family:'Poppins',sans-serif; font-weight:600; font-size:15px;
    padding:12px 14px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .chip:hover{ border-color:var(--gold); color:var(--gold);}
  .chip.selected{ border-color:var(--coral); color:var(--coral); background:rgba(242,102,90,0.08);}
  input[type="text"], input[type="date"]{
    width:100%; background:transparent; border:none; border-bottom:2px solid var(--muted);
    color:var(--cream); font-family:'Poppins',sans-serif; font-size:15px; padding:10px 2px;
    margin-bottom:18px; outline:none;
  }
  input[type="text"]::placeholder{ color:var(--muted); }
  input[type="text"]:focus, input[type="date"]:focus{ border-color:var(--gold); }
  .when{ display:flex; gap:10px; margin-bottom:6px; }
  .hidden{ display:none !important; }
  .btn-primary{
    width:100%; background:var(--gold); color:var(--bg); border:none;
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px;
    padding:14px; cursor:pointer; margin-top:8px; transition:transform .12s;
  }
  .btn-primary:hover{ transform:translateY(-1px); }
  .btn-primary:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; transform:none;}
  .summary{
    background:rgba(0,0,0,0.15); padding:16px; margin-bottom:18px; font-size:14px;
  }
  .summary div{ margin-bottom:6px; color:var(--cream); }
  .summary span{ color:var(--gold); font-weight:600; }
  .confirm-row{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; margin:20px 0 6px; position:relative; min-height:56px;}
  #btnNo{ position:relative; transition:transform .18s ease; }
  #btnSi{
    background:var(--coral); color:var(--cream); border:none;
    font-family:'Bebas Neue',sans-serif; letter-spacing:1px;
    padding:14px 22px; font-size:20px; cursor:pointer; transition:font-size .18s, padding .18s;
  }
  #btnNo{
    background:transparent; border:1.5px solid var(--muted); color:var(--muted);
    font-family:'Poppins',sans-serif; font-weight:600; padding:12px 18px; cursor:pointer;
  }
  .nudge{ text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-top:4px;}
  .final{ text-align:center; }
  .final h2{ font-family:'Bebas Neue',sans-serif; color:var(--gold); font-size:32px; margin:0 0 10px; }
  .mail-link{
    display:inline-block; margin-top:14px; color:var(--bg); background:var(--gold);
    text-decoration:none; font-family:'Bebas Neue',sans-serif; font-size:18px;
    letter-spacing:.5px; padding:12px 20px;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){ }
  }
</style>
</head>
<body>
<div class="ticket">

  <div id="stepChoose">
    <div class="sub">Una propuesta para</div>
    <h1>¿Salimos?</h1>
    <div class="stub-line"></div>

    <p class="label">Elige el plan</p>
    <div class="chips" id="foodChips">
      <button class="chip" data-value="Pizza">🍕 Pizza</button>
      <button class="chip" data-value="Hamburguesa">🍔 Hamburguesa</button>
      <button class="chip" data-value="Cine">🎬 Cine</button>
      <button class="chip" data-value="__otra">✨ Otra idea</button>
    </div>
    <input type="text" id="otraIdea" class="hidden" placeholder="Escribe tu propia idea...">

    <p class="label">¿Qué día?</p>
    <div class="chips when">
      <button class="chip" data-value="Mañana">Mañana</button>
      <button class="chip" data-value="__otro">Otro día</button>
    </div>
    <input type="date" id="otroDia" class="hidden">

    <button class="btn-primary" id="btnProponer" disabled>Proponer plan</button>
  </div>

  <div id="stepConfirm" class="hidden">
    <p class="sub">Resumen de la propuesta</p>
    <h1 style="font-size:32px;">¿Te parece bien?</h1>
    <div class="stub-line"></div>
    <div class="summary" id="summaryBox"></div>

    <div class="confirm-row" id="confirmRow">
      <button id="btnSi">Sí ✔</button>
      <button id="btnNo">No</button>
    </div>
    <div class="nudge" id="nudgeText"></div>
    <div class="nudge hidden" id="escapeWrap">
      <button id="btnEscape" style="background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:4px;">en serio, es no</button>
    </div>
  </div>

  <div id="stepFinal" class="hidden final">
    <div class="stub-line"></div>
    <h2 id="finalTitle"></h2>
    <div class="summary" id="finalSummary"></div>
    <p class="nudge" id="sendStatus">Enviando tu respuesta...</p>
    <a href="#" id="mailLink" class="mail-link hidden">Enviar respuesta por correo</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  // Cambia este correo por el tuyo antes de compartir la página
  const MI_CORREO = "infanteaquinoanthony31@gmail.com";

  // Configuración de EmailJS (gratis, sin backend) — para que el envío sea
  // automático necesitas crear una cuenta en emailjs.com y completar esto:
  const EMAILJS_PUBLIC_KEY  = "NyXQ0QZUmY7W89R6A";
  const EMAILJS_SERVICE_ID  = "service_utdrrt4";
  const EMAILJS_TEMPLATE_ID = "template_u77cgao";
  if (window.emailjs && EMAILJS_PUBLIC_KEY !== "NyXQ0QZUmY7W89R6A") {
    emailjs.init(EMAILJS_PUBLIC_KEY);
  }

  let plan = null, otraTexto = "", dia = null, otroDiaVal = "";

  const foodChips = document.querySelectorAll('#foodChips .chip');
  const otraIdea = document.getElementById('otraIdea');
  const whenChips = document.querySelectorAll('.when .chip');
  const otroDia = document.getElementById('otroDia');
  const btnProponer = document.getElementById('btnProponer');

  function checkReady(){
    const planOk = plan === '__otra' ? otraIdea.value.trim().length > 0 : !!plan;
    const diaOk = dia === '__otro' ? !!otroDia.value : !!dia;
    btnProponer.disabled = !(planOk && diaOk);
  }

  foodChips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      foodChips.forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      plan = chip.dataset.value;
      otraIdea.classList.toggle('hidden', plan !== '__otra');
      checkReady();
    });
  });
  otraIdea.addEventListener('input', checkReady);

  whenChips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      whenChips.forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      dia = chip.dataset.value;
      otroDia.classList.toggle('hidden', dia !== '__otro');
      checkReady();
    });
  });
  otroDia.addEventListener('input', checkReady);

  function planTexto(){
    return plan === '__otra' ? otraIdea.value.trim() : plan;
  }
  function diaTexto(){
    if (dia === '__otro') {
      if(!otroDia.value) return '';
      const d = new Date(otroDia.value + 'T00:00:00');
      return d.toLocaleDateString('es-PE', {weekday:'long', day:'numeric', month:'long'});
    }
    return 'Mañana';
  }

  btnProponer.addEventListener('click', ()=>{
    document.getElementById('summaryBox').innerHTML =
      `<div>Plan: <span>${planTexto()}</span></div><div>Día: <span>${diaTexto()}</span></div>`;
    document.getElementById('stepChoose').classList.add('hidden');
    document.getElementById('stepConfirm').classList.remove('hidden');
  });

  let noCount = 0;
  const btnSi = document.getElementById('btnSi');
  const btnNo = document.getElementById('btnNo');
  const escapeWrap = document.getElementById('escapeWrap');
  const nudges = [
    "El Sí se ve cada vez mejor, ¿no crees?",
    "Vamos, inténtalo de nuevo 👀",
    "El No ya no se deja atrapar tan fácil...",
    "En algún momento el Sí va a ser gigante",
    "¿Ya viste lo grande que está el Sí?",
  ];

  function moveNo(){
    const maxX = 60, maxY = 24;
    const x = (Math.random() * 2 - 1) * maxX;
    const y = (Math.random() * 2 - 1) * maxY;
    btnNo.style.transform = `translate(${x}px, ${y}px)`;
  }

  function growSi(){
    noCount++;
    const newSize = 20 + noCount * 5;
    const newPad = 14 + noCount * 3;
    btnSi.style.fontSize = newSize + 'px';
    btnSi.style.padding = newPad + 'px ' + (newPad + 8) + 'px';
    document.getElementById('nudgeText').textContent = nudges[Math.min(noCount - 1, nudges.length - 1)];
    moveNo();
    if (noCount >= 4) escapeWrap.classList.remove('hidden');
  }

  btnNo.addEventListener('mouseenter', ()=>{ if(noCount >= 1) moveNo(); });
  btnNo.addEventListener('click', growSi);

  function goFinal(respuesta){
    document.getElementById('stepConfirm').classList.add('hidden');
    const finalTitle = document.getElementById('finalTitle');
    const finalSummary = document.getElementById('finalSummary');
    finalTitle.textContent = respuesta === 'si' ? '¡Quedamos! 🎉' : 'Respuesta registrada';
    finalSummary.innerHTML =
      `<div>Plan: <span>${planTexto()}</span></div>
       <div>Día: <span>${diaTexto()}</span></div>
       <div>Respuesta: <span>${respuesta === 'si' ? 'Sí' : 'No'}</span></div>`;

    const subject = encodeURIComponent('Respuesta a tu propuesta de salida');
    const body = encodeURIComponent(
      `Plan: ${planTexto()}\nDía: ${diaTexto()}\nRespuesta: ${respuesta === 'si' ? 'Sí' : 'No'}`
    );
    document.getElementById('mailLink').href = `mailto:${MI_CORREO}?subject=${subject}&body=${body}`;

    const statusEl = document.getElementById('sendStatus');
    const mailLink = document.getElementById('mailLink');

    // Envío automático por EmailJS apenas se confirma la respuesta.
    // Solo funciona una vez publicado en tu propio hosting (GitHub Pages)
    // con las 3 claves de EmailJS ya configuradas arriba.
    if (window.emailjs && EMAILJS_PUBLIC_KEY !== "NyXQ0QZUmY7W89R6A") {
      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        plan: planTexto(),
        dia: diaTexto(),
        respuesta: respuesta === 'si' ? 'Sí' : 'No'
      }).then(()=>{
        statusEl.textContent = '✅ Tu respuesta ya fue enviada.';
      }).catch((err)=>{
        console.error('EmailJS error:', err);
        statusEl.textContent = 'No se pudo enviar automáticamente. Usa este enlace:';
        mailLink.classList.remove('hidden');
      });
    } else {
      statusEl.textContent = 'Envío automático no configurado. Usa este enlace:';
      mailLink.classList.remove('hidden');
    }

    document.getElementById('stepFinal').classList.remove('hidden');
  }

  btnSi.addEventListener('click', ()=> goFinal('si'));
  document.getElementById('btnEscape').addEventListener('click', ()=> goFinal('no'));
</script>
</body>
</html>
